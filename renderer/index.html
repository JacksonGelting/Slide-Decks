<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slide Decks</title>
  <!-- Everything is bundled locally: the app must work fully offline. -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/theme.css">
  <script src="vendor/katex/katex.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="stage" aria-live="polite">
    <div id="canvas" role="region" aria-roledescription="slide deck"></div>
  </main>
  <section id="message" hidden></section>
  <nav id="nav" hidden>
    <button type="button" id="nav-prev" aria-label="Previous slide">&#8249;</button>
    <span id="nav-count"></span>
    <button type="button" id="nav-next" aria-label="Next slide">&#8250;</button>
  </nav>
  <aside id="dev-panel" hidden></aside>
</body>
</html>
